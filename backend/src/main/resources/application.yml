spring:
  application:
    name: zhuatech-ehr
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_ehr?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:zhuatech}
    password: ${DB_PASSWORD:zhuatech_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET:change-this-zhuatech-ehr-secret-at-least-32-bytes}
    expiration: PT24H
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8088}
